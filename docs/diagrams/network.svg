<text x="1074" y="554" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve" font-weight="bold">web01</text>
<text x="1074" y="573" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   22/tcp  SSH via bastion</text>
<text x="1074" y="592" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   80, 443/tcp ← LAN</text>
<text x="1074" y="611" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   3000 closed (127.0.0.1 only)</text>
