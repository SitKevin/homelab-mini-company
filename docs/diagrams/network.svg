<text x="384" y="497" font-size="12.5" fill="#37474F">recursive for LAN, DNSSEC validation</text>
<text x="384" y="516" font-size="12.5" fill="#37474F">SSH :22 jump host (key only)</text>
<text x="384" y="535" font-size="12.5" fill="#9E9E9E" font-style="italic">Ansible controller (Phase 3)</text>
