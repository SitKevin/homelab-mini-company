<text x="1074" y="649" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve" font-weight="bold">db01</text>
<text x="1074" y="668" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   22/tcp  SSH via bastion</text>
<text x="1074" y="687" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   5432/tcp ← web01 only</text>
<text x="1074" y="706" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve">   389/tcp  ← web01 only</text>
<text x="1074" y="725" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="1074" y="744" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve" font-weight="bold">All nodes: fail2ban,</text>
<text x="1074" y="763" font-size="11.5" fill="#37474F" font-family="Menlo, Consolas, monospace" xml:space="preserve" font-weight="bold">SSH key-only, no root login</text>
