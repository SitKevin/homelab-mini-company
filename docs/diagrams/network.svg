<text x="744" y="478" font-size="12.5" fill="#37474F">Nginx :80 → 301 to HTTPS</text>
<text x="744" y="497" font-size="12.5" fill="#37474F">Nginx :443 · TLS 1.2/1.3 · Let&#x27;s Encrypt</text>
<text x="744" y="516" font-size="12.5" fill="#37474F">Gitea 127.0.0.1:3000 (systemd, user git)</text>
