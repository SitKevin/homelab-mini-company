# /etc/ssh/sshd_config.d/00-hardening.conf  (all nodes)
# Named 00- so it is read BEFORE 50-cloud-init.conf: sshd uses the first
# value it reads, and 50-cloud-init.conf sets "PasswordAuthentication yes".
# Verify with: sudo sshd -T | grep -E "passwordauth|permitroot"
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
