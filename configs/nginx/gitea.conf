# web01: /etc/nginx/sites-available/gitea
# Enable: sudo ln -s /etc/nginx/sites-available/gitea /etc/nginx/sites-enabled/
# Always:  sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    server_name git.sitkevin.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name git.sitkevin.duckdns.org;

    # Installed by acme.sh --install-cert (see docs/phase2-services.md)
    ssl_certificate     /etc/nginx/ssl/git.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/git.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Default is 1 MB -> large git pushes would fail with 413
    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
