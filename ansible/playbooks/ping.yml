# First playbook: check that Ansible can reach every node and become root.
# Run: ansible-playbook playbooks/ping.yml -K
- name: Connectivity check
  hosts: homelab
  gather_facts: true
  tasks:
    - name: Ping (SSH + Python works)
      ansible.builtin.ping:

    - name: Become root (sudo works)
      ansible.builtin.command: whoami
      become: true
      register: who
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} | {{ ansible_distribution }} {{ ansible_distribution_version }} | sudo -> {{ who.stdout }}"
