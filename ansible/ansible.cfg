# Ansible reads ./ansible.cfg when you run commands from this directory (ansible/).
[defaults]
inventory          = inventory/hosts.ini
remote_user        = sitkevin
roles_path         = roles
interpreter_python = auto_silent
forks              = 5
# Show changed/ok per task in a readable way
stdout_callback    = default
callback_result_format = yaml
# Keep host key checking ON: bastion already knows the nodes' keys (Phase 1)
host_key_checking  = True
retry_files_enabled = False

[ssh_connection]
# Reuse SSH connections -> much faster runs
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
# Ubuntu 26.04 uses sudo-rs by default; Ansible doesn't recognise its password
# prompt and times out (Launchpad #2122414). Use the original sudo (sudo.ws)
# until ansible-core ships a fix.
become_exe = sudo.ws
