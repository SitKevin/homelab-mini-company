# Inventory: which machines Ansible manages, grouped by role.
# ansible_host uses IPs (not DNS names) so Ansible still works if BIND on bastion is broken -
# Ansible is the tool you'd use to FIX BIND.

[jumphost]
bastion ansible_host=192.168.196.10 ansible_connection=local

[web]
web01   ansible_host=192.168.196.11

[db]
db01    ansible_host=192.168.196.12

[monitoring]
mon01   ansible_host=192.168.196.13

# All Linux servers in the lab
[homelab:children]
jumphost
web
db
monitoring
