# Role "node_exporter": host metrics (CPU, RAM, disk, network) on :9100.
node_exporter_port: 9100
# Only the Prometheus server may scrape it (ufw). Everyone else is denied by default.
node_exporter_allowed_from: "{{ mon01_ip }}"
# Extra collectors recommended by the "Node Exporter Full" dashboard
node_exporter_textfile_dir: /var/lib/prometheus/node-exporter
# + textfile collector: scripts (e.g. backups) drop *.prom files there
node_exporter_args: "--collector.systemd --collector.processes --collector.textfile.directory={{ node_exporter_textfile_dir }}"
