- name: Install node_exporter (Ubuntu package)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false   # skip ipmitool/smartmontools/nvme-cli... (useless on VMs)
    update_cache: true
    cache_valid_time: 3600

- name: Textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: node_exporter options (extra collectors)
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="{{ node_exporter_args }}"'
    create: true   # created by the package; only missing during --check on a fresh host
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: node_exporter is enabled and running
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
  # On a fresh host --check can't start a service that isn't installed yet
  ignore_errors: "{{ ansible_check_mode }}"

# The rule lives in this role (not in host_vars): remove the role, remove the rule.
- name: ufw - node_exporter only from the Prometheus server
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port | string }}"
    proto: tcp
    from_ip: "{{ node_exporter_allowed_from }}"
    comment: node_exporter from mon01
  when: inventory_hostname not in groups['monitoring']   # mon01 scrapes itself locally
