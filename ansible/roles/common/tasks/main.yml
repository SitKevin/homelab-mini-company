# Role "common": baseline for every server (Phase 1 hardening, as code).

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600   # don't run "apt update" again if done < 1h ago

# ---------------------------------------------------------------- SSH
- name: SSH hardening drop-in (key-only, no root login)
  ansible.builtin.copy:
    src: "{{ common_configs_dir }}/ssh/00-hardening.conf"
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: ssh config changed

# ---------------------------------------------------------------- CA
- name: Trust the homelab internal CA (used by LDAP StartTLS)
  ansible.builtin.copy:
    src: "{{ common_configs_dir }}/ldap/homelab-ca.crt"
    dest: /usr/local/share/ca-certificates/homelab-ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: update ca certificates

# ---------------------------------------------------------------- fail2ban
- name: fail2ban jail.local
  ansible.builtin.copy:
    src: "{{ common_configs_dir }}/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---------------------------------------------------------------- ufw
# Rules are added BEFORE touching the default policy / enabling ufw,
# so SSH is never cut off. ufw itself skips rules that already exist.
- name: ufw rules (port based)
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default(omit) }}"
    from_ip: "{{ item.from | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_rules | selectattr('port', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('any') }} <- {{ item.from | default('any') }}"

- name: ufw rules (application profiles)
  community.general.ufw:
    rule: allow
    name: "{{ item.app }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_rules | selectattr('app', 'defined') | list }}"
  loop_control:
    label: "{{ item.app }}"

- name: ufw default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: ufw enabled
  community.general.ufw:
    state: enabled
