# Role "postgres_exporter": PostgreSQL metrics on :9187 (db01).
# No password: the exporter runs as the Linux user "prometheus" and connects through the
# Unix socket with "peer" auth (pg_hba: local all all peer) to the DB role of the same name.
postgres_exporter_port: 9187
postgres_exporter_dsn: "host=/run/postgresql user=prometheus dbname=postgres"
postgres_exporter_allowed_from: "{{ mon01_ip }}"
