# /etc/prometheus/blackbox.yml - managed by Ansible (role blackbox_exporter)
modules:
  # HTTPS check: status 2xx after redirects + TLS certificate valid.
  # Also exposes probe_ssl_earliest_cert_expiry (used for the cert-expiry alert).
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
