- name: Install Prometheus (Ubuntu package, includes promtool)
  ansible.builtin.apt:
    name: prometheus
    state: present
    install_recommends: false   # minimal install: only hard dependencies
    update_cache: true
    cache_valid_time: 3600

- name: Startup options - listen on localhost only, retention
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address={{ prometheus_listen }} --storage.tsdb.retention.time={{ prometheus_retention }}"'
    create: true   # created by the package; only missing during --check on a fresh host
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus

- name: Rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: root
    group: root
    mode: "0755"

# copy (not template): the rules use Prometheus' own {{ $labels }} templating
- name: Alerting rules (validated with promtool)
  ansible.builtin.copy:
    src: homelab-rules.yml
    dest: /etc/prometheus/rules/homelab.yml
    owner: root
    group: root
    mode: "0644"
    validate: promtool check rules %s
  notify: reload prometheus

- name: prometheus.yml (targets built from the inventory)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
    validate: promtool check config %s      # never install a config Prometheus would reject
  notify: reload prometheus

- name: Prometheus is enabled and running
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
