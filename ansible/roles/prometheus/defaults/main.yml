# Role "prometheus": metrics server on mon01.
prometheus_listen: 127.0.0.1:9090      # localhost only - reached through an SSH tunnel
prometheus_retention: 15d              # keep 15 days of metrics (disk-friendly for a lab)
prometheus_scrape_interval: 15s

# URLs probed from the outside by blackbox_exporter (status + TLS certificate)
prometheus_blackbox_targets:
  - https://git.sitkevin.duckdns.org
prometheus_blackbox_listen: 127.0.0.1:9115
