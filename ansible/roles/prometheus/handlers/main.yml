# Startup options need a restart; prometheus.yml only a reload (SIGHUP, no data loss).
- name: restart prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"   # fresh host: service doesn't exist during --check

- name: reload prometheus
  ansible.builtin.service:
    name: prometheus
    state: reloaded
  ignore_errors: "{{ ansible_check_mode }}"
